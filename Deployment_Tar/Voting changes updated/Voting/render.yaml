# Render Blueprint — deploy the voting app as ONE persistent Node process with a
# persistent disk. This matches the app's design (single process serializes
# ballots; local SQLite + signing key + photo uploads live on the disk).
#
# NOTE: a persistent disk requires a PAID instance (Starter and up). The free
# plan has no disk and spins the service down when idle, which would lose the
# election database — do not run a real election on the free plan.
services:
  - type: web
    name: campus-voting
    runtime: node
    plan: starter            # needed for the persistent disk below
    region: oregon           # pick the region nearest your voters
    buildCommand: npm install
    # Generate the signing keypair once (only if absent), then start the server.
    # Env vars come from Render, so we do NOT use --env-file here.
    startCommand: sh -c 'test -f "$KEY_DIR/server_ed25519.pem" || node src/crypto.js keygen; node src/server.js'
    healthCheckPath: /info
    autoDeploy: true
    numInstances: 1          # MUST stay 1 — the ballot-serialization guarantee is per-process
    envVars:
      - key: NODE_VERSION
        value: "24.8.0"       # node:sqlite runs unflagged on Node 24
      - key: DB_FILE
        value: /data/election.db
      - key: KEY_DIR
        value: /data/keys
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: ADMIN_KEY
        generateValue: true   # view the generated value in the Render dashboard
      - key: OPERATOR_KEY
        generateValue: true
      # Set these yourself in the dashboard (sync:false = not stored in git):
      - key: BASE_URL
        sync: false           # e.g. https://campus-voting.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: election-data
      mountPath: /data
      sizeGB: 1
