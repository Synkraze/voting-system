# Campus Election — nginx reverse proxy for the Node app on 127.0.0.1:3000.
# Put this at /etc/nginx/sites-available/voting, symlink into sites-enabled,
# then run certbot to add HTTPS (it rewrites this file to add the :443 block).
#
#   sudo ln -s /etc/nginx/sites-available/voting /etc/nginx/sites-enabled/voting
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vote.YOURDOMAIN.com
#
# ONE domain (or subdomain) is enough — voters use "/" and admins use "/admin.html"
# on the same host. Replace vote.YOURDOMAIN.com below with your real hostname.

server {
    listen 80;
    listen [::]:80;
    server_name vote.YOURDOMAIN.com;

    # Base64 photo uploads can approach the app's 4 MB JSON limit.
    client_max_body_size 5m;

    # (Optional) restrict the admin page to office IPs — uncomment and set your IP:
    # location = /admin.html { allow 203.0.113.10; deny all; proxy_pass http://127.0.0.1:3000; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
